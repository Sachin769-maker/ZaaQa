<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5200"/>
      <stop offset="100%" stop-color="#FF7A3D"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <rect x="6" y="14" width="50" height="50" rx="15" fill="rgba(255,82,0,0.25)" filter="url(#blur)"/>
  <!-- Icon box -->
  <rect x="2" y="8" width="50" height="50" rx="15" fill="url(#g1)"/>
  <!-- Shine overlay -->
  <rect x="2" y="8" width="50" height="24" rx="15" fill="rgba(255,255,255,0.18)"/>
  <!-- Fork icon -->
  <text x="27" y="40" font-size="24" text-anchor="middle" fill="white">🍽️</text>
  <!-- ZaaQa text -->
  <text x="62" y="48" font-family="Georgia, serif" font-size="32" font-weight="900" fill="#1C1C1E" letter-spacing="-1">Zaa</text>
  <text x="114" y="48" font-family="Georgia, serif" font-size="32" font-weight="900" fill="#FF5200" letter-spacing="-1">Qa</text>
  <!-- Tagline -->
  <text x="62" y="62" font-family="Arial, sans-serif" font-size="8.5" fill="#ADADAD" letter-spacing="2.5" font-weight="600">AMRITSAR FOOD DELIVERY</text>
</svg>
